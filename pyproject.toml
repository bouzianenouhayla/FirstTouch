[project]
name = "firsttouch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "pydantic>=2.7.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "logtail-python>=0.3.0",
    "langsmith>=0.1.0",
    "pandas>=2.2.0",
    "statsbombpy>=1.0.3",
    "requests>=2.32.0",
    "langchain-community>=0.2.0,<0.3.0",
]

[dependency-groups]
local = [
    "llama-cpp-python>=0.2.90",
]
eval = [
    "ragas>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain>=0.2.0",
    "langchain-huggingface>=0.0.3",
    "kaggle>=1.6.14",
    "PyPDF2>=3.0.0",
    "tqdm>=4.66.0",
]
dev = [
    "pytest>=8.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
